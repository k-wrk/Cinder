[package]
name = "cinder"
version = "1.5.1"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tokio = { version = "1.43", features = ["rt-multi-thread", "macros"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
trash = "5.2"
chrono = "0.4"
walkdir = "2.5"
dirs = "6.0"

[lib]
name = "cinder"
path = "src/lib.rs"

[[bin]]
name = "cinder"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3.17"
